# ==============================================================================
# Nginx Reverse Proxy Configuration for SPA Lan Anh Beauty
# Single Domain Setup: lananhbeauty.thanhbtdev.id.vn
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version information
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access_log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers (Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream backend and frontend services
    upstream backend_app {
        server backend:5000;
    }

    upstream frontend_app {
        server frontend:5173;
    }

    server {
        listen 80;
        server_name lananhbeauty.thanhbtdev.id.vn www.lananhbeauty.thanhbtdev.id.vn _;

        # Max payload size for image uploads
        client_max_body_size 10M;

        # Block access to hidden files (.env, .git, etc.)
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Frontend SPA
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend REST API -> lananhbeauty.thanhbtdev.id.vn/api
        location /api {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SePay Webhook Root Aliases -> lananhbeauty.thanhbtdev.id.vn/sepay-webhook
        location ~ ^/(sepay-webhook|webhook|sepay)$ {
            proxy_pass http://backend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Backend Static Uploads -> lananhbeauty.thanhbtdev.id.vn/uploads/
        location /uploads/ {
            proxy_pass http://backend_app/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Socket.io Websocket Live Chat -> lananhbeauty.thanhbtdev.id.vn/socket.io/
        location /socket.io/ {
            proxy_pass http://backend_app/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
