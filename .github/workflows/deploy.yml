name: CD - Deploy to Production VPS

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "Starting deployment on VPS..."
            
            # Navigate to target directory
            cd ${{ secrets.DEPLOY_PATH || '/var/www/spa-lan-anh-beauty' }}
            
            # Fetch and reset code to latest main
            echo "Fetching latest code from main..."
            git fetch origin main
            git reset --hard origin/main
            
            # Build & Restart containers via Production Docker Compose
            echo "Building and starting Docker containers..."
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            
            # Run Database Migrations inside backend container
            echo "Running Database Migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend npm run db:migrate || true
            
            # Clean up dangling images to free disk space
            echo "Pruning unused Docker images..."
            docker image prune -f
            
            # Container status verification
            echo "Checking running containers..."
            docker compose -f docker-compose.prod.yml ps
            
            echo "Deployment completed successfully!"
